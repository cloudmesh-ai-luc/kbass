groups:
  - name: flask_application_alerts
    rules:
      - alert: ApplicationDown
        expr: up{job="flask-app"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Flask application is down"
          description: "Prometheus cannot reach the Flask application for at least 15 seconds."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(app_http_requests_total{status=~"5.."}[1m]))
            /
            clamp_min(sum(rate(app_http_requests_total[1m])), 0.001)
          ) > 0.05
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High HTTP server error rate"
          description: "More than 5% of HTTP requests have returned 5xx errors for at least 30 seconds."