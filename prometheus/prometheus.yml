global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "flask-app"
    static_configs:
      - targets: ["app:8000"]

  - job_name: "registered-apps"
    scheme: https
    metrics_path: /metrics
    scrape_timeout: 4s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 5s
