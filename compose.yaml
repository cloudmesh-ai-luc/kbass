services:
  app:
    build: .
    container_name: kbass-monitoring-app
    env_file:
      - .env.cloudops
    volumes:
      - ./data:/app/data
      - ./prometheus/targets:/app/prometheus/targets
    ports:
      - "127.0.0.1:8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: kbass-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: kbass-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus