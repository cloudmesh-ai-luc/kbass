services:
  app:
    build: .
    container_name: kbass-monitoring-app
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: kbass-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app