[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbass-monitoring"
version = "0.1.0"
description = "AI-assisted cloud monitoring and troubleshooting dashboard"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "Flask-Limiter>=3.12,<5",
    "prometheus_client==0.26.0",
    "mkdocs",
    "mkdocs-material",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kbass_monitoring = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
]
